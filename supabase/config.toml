project_id = "autobid-lk"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback?next=/account/password"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.email.template.confirmation]
subject = "Confirm your AutoBid LK email"
content_path = "./supabase/templates/confirmation-en.html"

[auth.email.template.recovery]
subject = "Reset your AutoBid LK password"
content_path = "./supabase/templates/recovery-en.html"
